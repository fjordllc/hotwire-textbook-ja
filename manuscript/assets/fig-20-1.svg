  <rect x="38" y="82" width="1124" height="240" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="84" y="138" width="252" height="100" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="424" y="138" width="320" height="100" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><rect x="804" y="138" width="312" height="100" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="210" y="168" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="210" dy="0">HTML: data-action=&quot;input-&gt;counter#count&quot;</tspan></text><text x="210" y="196" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="210" dy="0">data-counter-target=&quot;field&quot;</tspan></text><text x="584" y="168" text-anchor="middle" style="font: 700 18px sans-serif; fill: #3a6ea5;"><tspan x="584" dy="0">counter controller</tspan></text><text x="584" y="196" text-anchor="middle" style="font: 700 14px sans-serif; fill: #3a6ea5;"><tspan x="584" dy="0">count() / this.fieldTarget</tspan></text><text x="960" y="168" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="960" dy="0">output target</tspan></text><text x="960" y="196" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="960" dy="0">文字数表示</tspan></text><line x1="338" y1="188" x2="418" y2="188" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><line x1="744" y1="188" x2="796" y2="188" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
