<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 1200 354" role="img" aria-label="一覧描画で N+1 が起きる様子と、includes で解消する様子をクエリ本数で対比する図。">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#3a6ea5"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#ffffff"/>
  <style>
    .title { font: 700 28px sans-serif; fill: #1f2933; }
    .small { font: 600 15px sans-serif; fill: #52606d; }
    .tiny { font: 500 13px sans-serif; fill: #52606d; }
  </style>
  
  <rect x="38" y="82" width="1124" height="260" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="82" y="138" width="460" height="150" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="658" y="138" width="460" height="150" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="312" y="168" text-anchor="middle" style="font: 700 20px sans-serif; fill: #1f2933;"><tspan x="312" dy="0">N+1</tspan></text><text x="312" y="196" text-anchor="middle" style="font: 700 18px sans-serif; fill: #b23a48;"><tspan x="312" dy="0">1 + 20 + 20 ...</tspan></text><text x="312" y="224" text-anchor="middle" style="font: 700 16px sans-serif; fill: #1f2933;"><tspan x="312" dy="0">クエリが増える</tspan></text><text x="888" y="168" text-anchor="middle" style="font: 700 20px sans-serif; fill: #3a6ea5;"><tspan x="888" dy="0">includes</tspan></text><text x="888" y="196" text-anchor="middle" style="font: 700 18px sans-serif; fill: #3a6ea5;"><tspan x="888" dy="0">まとめて数本</tspan></text><text x="888" y="224" text-anchor="middle" style="font: 700 16px sans-serif; fill: #1f2933;"><tspan x="888" dy="0">broadcast の partial でも同じ</tspan></text><line x1="150" y1="258" x2="470" y2="258" stroke="#b23a48" stroke-width="10" fill="none" /><line x1="726" y1="258" x2="1046" y2="258" stroke="#3a6ea5" stroke-width="10" fill="none" />
</svg>
