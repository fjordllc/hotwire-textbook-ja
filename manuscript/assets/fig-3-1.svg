<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 1200 374" role="img" aria-label="Rails の MVC、partial、REST、Action Cable が Turbo Drive/Frames、Streams、broadcast へつながることを示す対応図。">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a6ea5"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <style>
    .title { font: 700 28px sans-serif; fill: #1f2933; }
    .label { font: 700 18px sans-serif; fill: #1f2933; }
    .small { font: 600 15px sans-serif; fill: #52606d; }
    .tiny { font: 500 13px sans-serif; fill: #52606d; }
  </style>
  
  <rect x="44" y="84" width="1112" height="290" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="94" y="130" width="300" height="42" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="806" y="130" width="300" height="42" rx="12" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="244" y="157" text-anchor="middle" style="font: 700 16px sans-serif; fill: #1f2933;"><tspan x="244" dy="0">MVC で HTML を返す</tspan></text><text x="956" y="157" text-anchor="middle" style="font: 700 16px sans-serif; fill: #3a6ea5;"><tspan x="956" dy="0">Turbo Drive / Frames</tspan></text><line x1="398" y1="151" x2="790" y2="151" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="94" y="185" width="300" height="42" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="806" y="185" width="300" height="42" rx="12" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="244" y="212" text-anchor="middle" style="font: 700 16px sans-serif; fill: #1f2933;"><tspan x="244" dy="0">partial</tspan></text><text x="956" y="212" text-anchor="middle" style="font: 700 16px sans-serif; fill: #3a6ea5;"><tspan x="956" dy="0">Turbo Streams</tspan></text><line x1="398" y1="206" x2="790" y2="206" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="94" y="240" width="300" height="42" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="806" y="240" width="300" height="42" rx="12" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="244" y="267" text-anchor="middle" style="font: 700 16px sans-serif; fill: #1f2933;"><tspan x="244" dy="0">RESTful controller</tspan></text><text x="956" y="267" text-anchor="middle" style="font: 700 16px sans-serif; fill: #3a6ea5;"><tspan x="956" dy="0">Turbo Streams 応答</tspan></text><line x1="398" y1="261" x2="790" y2="261" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="94" y="295" width="300" height="42" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="806" y="295" width="300" height="42" rx="12" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="244" y="322" text-anchor="middle" style="font: 700 16px sans-serif; fill: #1f2933;"><tspan x="244" dy="0">Action Cable</tspan></text><text x="956" y="322" text-anchor="middle" style="font: 700 16px sans-serif; fill: #3a6ea5;"><tspan x="956" dy="0">broadcast</tspan></text><line x1="398" y1="316" x2="790" y2="316" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="600" y="120" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="600" dy="0">Rails の延長</tspan></text><text x="600" y="340" text-anchor="middle" style="font: 600 15px sans-serif; fill: #52606d;"><tspan x="600" dy="0">別物ではなく、既存の仕組みの自然な接続</tspan></text>
</svg>
