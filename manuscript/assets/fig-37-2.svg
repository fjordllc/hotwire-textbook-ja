<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 1200 374" role="img" aria-label="CRUD 中心か、クライアント状態、オフライン、チーム、API 要否の問いから、Hotwire 向きか SPA/混在向きかを導く図。">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#3a6ea5"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <style>
    .title { font: 700 28px sans-serif; fill: #1f2933; }
    .small { font: 600 15px sans-serif; fill: #52606d; }
    .tiny { font: 500 13px sans-serif; fill: #52606d; }
  </style>
  
  <rect x="38" y="82" width="1124" height="280" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="96" y="120" width="508" height="30" rx="10" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="350" y="140" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="350" dy="0">データの CRUD が中心?</tspan></text><rect x="96" y="160" width="508" height="30" rx="10" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="350" y="180" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="350" dy="0">クライアント状態は小さい?</tspan></text><rect x="96" y="200" width="508" height="30" rx="10" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="350" y="220" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="350" dy="0">オフライン不要?</tspan></text><rect x="96" y="240" width="508" height="30" rx="10" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="350" y="260" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="350" dy="0">チームは Rails 寄り?</tspan></text><rect x="96" y="280" width="508" height="30" rx="10" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="350" y="300" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="350" dy="0">Web だけなら API 不要?</tspan></text><rect x="738" y="136" width="160" height="88" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><rect x="960" y="136" width="160" height="88" rx="16" fill="#f4e9dc" stroke="#c9a26b" stroke-width="2"/><text x="818" y="168" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="818" dy="0">Yes が多い</tspan></text><text x="818" y="196" text-anchor="middle" style="font: 700 18px sans-serif; fill: #3a6ea5;"><tspan x="818" dy="0">Hotwire</tspan></text><text x="1040" y="168" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="1040" dy="0">No が多い</tspan></text><text x="1040" y="196" text-anchor="middle" style="font: 700 18px sans-serif; fill: #c9a26b;"><tspan x="1040" dy="0">SPA / 混在</tspan></text><text x="900" y="292" text-anchor="middle" style="font: 700 15px sans-serif; fill: #52606d;"><tspan x="900" dy="0">質問に答えると採用方針が見える</tspan></text>
</svg>
