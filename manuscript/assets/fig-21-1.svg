    .small { font: 600 15px sans-serif; fill: #52606d; }
    .tiny { font: 500 13px sans-serif; fill: #52606d; }
  </style>
  
  <rect x="38" y="82" width="1124" height="240" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="90" y="138" width="420" height="116" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><rect x="690" y="138" width="420" height="116" rx="16" fill="#f4e9dc" stroke="#c9a26b" stroke-width="2"/><text x="300" y="168" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="300" dy="0">HTML に状態</tspan></text><text x="300" y="196" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="300" dy="0">data-...-value / class</tspan></text><text x="300" y="224" text-anchor="middle" style="font: 700 14px sans-serif; fill: #3a6ea5;"><tspan x="300" dy="0">スナップショットに含まれる</tspan></text><text x="900" y="168" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="900" dy="0">JS だけに状態</tspan></text><text x="900" y="196" text-anchor="middle" style="font: 700 14px sans-serif; fill: #1f2933;"><tspan x="900" dy="0">controller の instance variable</tspan></text><text x="900" y="224" text-anchor="middle" style="font: 700 14px sans-serif; fill: #c9a26b;"><tspan x="900" dy="0">差し替えで消える</tspan></text><line x1="510" y1="196" x2="682" y2="196" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
