  <rect x="38" y="82" width="1124" height="260" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="80" y="150" width="220" height="84" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="190" y="178" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="190" dy="0">検索ボックス</tspan></text><text x="190" y="206" text-anchor="middle" style="font: 700 14px sans-serif; fill: #52606d;"><tspan x="190" dy="0">Stimulus debounce</tspan></text><rect x="380" y="150" width="200" height="84" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="480" y="178" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="480" dy="0">GET /tasks?q=…</tspan></text><text x="480" y="206" text-anchor="middle" style="font: 700 14px sans-serif; fill: #3a6ea5;"><tspan x="480" dy="0">submit</tspan></text><rect x="650" y="150" width="220" height="84" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="760" y="178" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="760" dy="0">task_list frame</tspan></text><text x="760" y="206" text-anchor="middle" style="font: 700 14px sans-serif; fill: #52606d;"><tspan x="760" dy="0">差し替え</tspan></text><rect x="940" y="150" width="150" height="84" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="1015" y="178" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="1015" dy="0">URL</tspan></text><text x="1015" y="206" text-anchor="middle" style="font: 700 14px sans-serif; fill: #52606d;"><tspan x="1015" dy="0">?q=…</tspan></text><line x1="300" y1="192" x2="372" y2="192" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><line x1="580" y1="192" x2="642" y2="192" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><line x1="870" y1="192" x2="932" y2="192" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
