  <rect x="36" y="72" width="888" height="300" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="360" y="106" width="240" height="52" rx="14" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="480" y="139" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="480" dy="0">フォーム送信</tspan></text><line x1="480" y1="158" x2="480" y2="190" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="170" y="198" width="220" height="68" rx="14" fill="#eef1f5" stroke="#3a6ea5" stroke-width="2"/><rect x="570" y="198" width="220" height="68" rx="14" fill="#f4e9dc" stroke="#c9a26b" stroke-width="2"/><text x="280" y="226" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="280" dy="0">成功</tspan></text><text x="280" y="250" text-anchor="middle" style="font: 700 14px sans-serif; fill: #3a6ea5;"><tspan x="280" dy="0">redirect / 303</tspan></text><text x="680" y="226" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="680" dy="0">失敗</tspan></text><text x="680" y="250" text-anchor="middle" style="font: 700 14px sans-serif; fill: #c9a26b;"><tspan x="680" dy="0">render / 422</tspan></text><line x1="360" y1="233" x2="390" y2="233" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><line x1="580" y1="233" x2="550" y2="233" stroke="#3a6ea5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="340" y="300" width="280" height="54" rx="14" fill="#f6e7e9" stroke="#b23a48" stroke-width="2"/><text x="480" y="333" text-anchor="middle" style="font: 700 16px sans-serif; fill: #b23a48;"><tspan x="480" dy="0">Drive の非 GET・200 HTML は不可</tspan></text>
</svg>
