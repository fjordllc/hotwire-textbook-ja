<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 1200 374" role="img" aria-label="ページ離脱時のスナップショット保存と、リンクで再訪時のプレビューから最新差し替えまでの流れを示す図。">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#3a6ea5"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <style>
    .title { font: 700 28px sans-serif; fill: #1f2933; }
    .small { font: 600 15px sans-serif; fill: #52606d; }
    .tiny { font: 500 13px sans-serif; fill: #52606d; }
  </style>
  
  <rect x="38" y="82" width="1124" height="280" rx="18" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><rect x="86" y="150" width="168" height="86" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="170" y="182" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="170" dy="0">ページ A</tspan></text><text x="170" y="208" text-anchor="middle" style="font: 600 13px sans-serif; fill: #52606d;"><tspan x="170" dy="0">表示</tspan></text><line x1="254" y1="193" x2="280" y2="193" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="296" y="150" width="168" height="86" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="380" y="182" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="380" dy="0">before-cache</tspan></text><text x="380" y="208" text-anchor="middle" style="font: 600 13px sans-serif; fill: #52606d;"><tspan x="380" dy="0">スナップショット保存</tspan></text><line x1="464" y1="193" x2="490" y2="193" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="506" y="150" width="168" height="86" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="590" y="182" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="590" dy="0">ページ B</tspan></text><text x="590" y="208" text-anchor="middle" style="font: 600 13px sans-serif; fill: #52606d;"><tspan x="590" dy="0">遷移</tspan></text><line x1="674" y1="193" x2="700" y2="193" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="716" y="150" width="168" height="86" rx="16" fill="#dce9f2" stroke="#3a6ea5" stroke-width="2"/><text x="800" y="182" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="800" dy="0">リンクで再訪</tspan></text><text x="800" y="208" text-anchor="middle" style="font: 600 13px sans-serif; fill: #52606d;"><tspan x="800" dy="0">プレビュー表示</tspan></text><line x1="884" y1="193" x2="910" y2="193" stroke="#3a6ea5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="926" y="150" width="168" height="86" rx="16" fill="#eef1f5" stroke="#b8c2cc" stroke-width="2"/><text x="1010" y="182" text-anchor="middle" style="font: 700 17px sans-serif; fill: #1f2933;"><tspan x="1010" dy="0">最新取得</tspan></text><text x="1010" y="208" text-anchor="middle" style="font: 600 13px sans-serif; fill: #52606d;"><tspan x="1010" dy="0">差し替え</tspan></text><text x="600" y="118" text-anchor="middle" style="font: 700 18px sans-serif; fill: #1f2933;"><tspan x="600" dy="0">プレビューは古い内容を一瞬見せる</tspan></text>
</svg>
